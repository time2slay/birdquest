# Builds signed APKs on every push to master and publishes them as the
# latest GitHub release:
#   https://github.com/time2slay/birdquest/releases/latest
# Direct download (64-bit phones, almost all current ones):
#   https://github.com/time2slay/birdquest/releases/latest/download/birdquest-arm64-v8a.apk
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   BIRDQUEST_KEYSTORE_BASE64   the release keystore, base64-encoded
#   BIRDQUEST_STORE_PASSWORD    keystore password
#   BIRDQUEST_KEY_ALIAS         key alias
#   BIRDQUEST_KEY_PASSWORD      key password
name: Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIRDQUEST_KEYSTORE_BASE64 }}
        run: |
          # Never publish debug-signed APKs: updates would not install over them.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret BIRDQUEST_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APKs
        env:
          BIRDQUEST_KEYSTORE: ${{ runner.temp }}/release.jks
          BIRDQUEST_STORE_PASSWORD: ${{ secrets.BIRDQUEST_STORE_PASSWORD }}
          BIRDQUEST_KEY_ALIAS: ${{ secrets.BIRDQUEST_KEY_ALIAS }}
          BIRDQUEST_KEY_PASSWORD: ${{ secrets.BIRDQUEST_KEY_PASSWORD }}
        run: |
          # Build numbers only grow, so each release installs over the last.
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number=$((GITHUB_RUN_NUMBER + 100))
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/birdquest-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/birdquest-armeabi-v7a.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BirdQuest build ${{ github.run_number }}
          make_latest: true
          body: |
            Built from ${{ github.sha }}.

            **Which file?** Most phones: `birdquest-arm64-v8a.apk`.
            Older 32-bit phones: `birdquest-armeabi-v7a.apk`.
          files: dist/*.apk
